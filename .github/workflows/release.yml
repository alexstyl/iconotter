name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to increase
        required: true
        type: choice
        options: [patch, minor, major]

jobs:
  release:
    uses: composablehorizons/.github/.github/workflows/cli-release.yml@main
    with:
      bump: ${{ inputs.bump }}
    permissions:
      contents: write
    secrets: inherit
